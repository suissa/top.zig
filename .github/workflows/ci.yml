name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Resolve tui.zig
        run: zig fetch --save "git+https://github.com/muhammad-fiaz/tui.zig.git"
      - name: Format check
        run: zig fmt --check build.zig src
      - name: Tests
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
